  <!-- Fails loudly. A module that throws on import takes the whole
       graph down silently: reveals never fire, so the page renders as
       invisible text with no console open to explain it. This makes
       that state self-reporting, and reveals the content anyway so the
       page is still readable when JS dies. -->
  <script>
    (function () {
      var shown = false
      function report(msg) {
        if (shown) return
        shown = true
        document.documentElement.classList.add('js-failed')
        var b = document.createElement('div')
        b.setAttribute('role', 'alert')
        b.style.cssText =
          'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:10px 14px;' +
          'font:12px/1.5 ui-monospace,Consolas,monospace;background:#3a0d0d;color:#ffd9d4;' +
          'border-top:1px solid #ff6b5a;white-space:pre-wrap;word-break:break-word'
        b.textContent =
          'Script failed — ' + msg +
          '\n\nHard-reload (Ctrl+Shift+R). If it persists, this is the real error.'
        document.body.appendChild(b)
      }
      addEventListener('error', function (e) {
        if (e.message) report(e.message + (e.filename ? '  @ ' + e.filename.split('/').pop() : ''))
      }, true)
      addEventListener('unhandledrejection', function (e) {
        report(String((e.reason && e.reason.message) || e.reason))
      })
    })()
  </script>
